<section class="stats d-grid compact-stats" [class.stats-two]="columns() === 2" [class.stats-three]="columns() === 3" [class.stats-four]="columns() === 4" [class.stats-five]="columns() === 5">
  @for (item of items(); track item.key || item.label) {
    @if (item.key) {
      <button type="button" class="stat-item d-flex items-baseline justify-center gap-8" [class.green]="item.tone === 'green'" [class.amber]="item.tone === 'amber'" [class.violet]="item.tone === 'violet'" [class.red]="item.tone === 'red'" [class.blue]="item.tone === 'blue'" [class.active]="activeKey() === item.key" [attr.aria-pressed]="activeKey() === item.key" (click)="select(item)">
        <strong class="d-block fs-20">{{ item.value }}</strong>
        <span class="d-block mt-0 fs-12 text-muted">{{ item.label }}</span>
      </button>
    } @else {
      <div class="stat-item d-flex items-baseline justify-center gap-8" [class.green]="item.tone === 'green'" [class.amber]="item.tone === 'amber'" [class.violet]="item.tone === 'violet'" [class.red]="item.tone === 'red'" [class.blue]="item.tone === 'blue'">
        <strong class="d-block fs-20">{{ item.value }}</strong>
        <span class="d-block mt-0 fs-12 text-muted">{{ item.label }}</span>
      </div>
    }
  }
</section>
