<div class="modal-head d-flex items-start justify-between gap-20 pb-8 border-b-1">
  <div class="min-w-0">
    <h2 class="m-0 text-black lh-125">{{ title() }}</h2>
    @if (subtitle()) {
      <span class="d-block mt-8 fs-12 lh-15 {{ subtitleClass || 'text-muted' }}">{{ subtitle() }}</span>
    }
  </div>
  <button
    class="modal-close d-grid place-items-center flex-none p-0 border-0 text-muted"
    (click)="closed.emit()"
    aria-label="关闭"
  >
    <dc-icon name="close"></dc-icon>
  </button>
</div>
