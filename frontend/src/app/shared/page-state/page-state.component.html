<div
  class="page-state d-flex flex-col items-center justify-center text-muted gap-12 py-48 px-20 w-full min-h-200"
>
  @if (loading()) {
    <span class="page-state-spinner w-30 h-30 rounded-50" aria-hidden="true"></span>
    <span class="page-state-text text-center lh-16 break-word">读取中…</span>
  } @else if (error()) {
    <span class="text-red lh-1 fs-28" aria-hidden="true">⚠</span>
    <span class="page-state-text text-red text-center lh-16 break-word fw-600">{{ error() }}</span>
    @if (retryable()) {
      <button
        type="button"
        class="btn text-white bg-blue page-state-retry mt-4"
        (click)="retry.emit()"
      >
        重试
      </button>
    }
  } @else {
    <span class="text-blue lh-1 fs-28" aria-hidden="true">○</span>
    <span class="page-state-text text-center lh-16 break-word">{{ emptyText() }}</span>
  }
</div>
