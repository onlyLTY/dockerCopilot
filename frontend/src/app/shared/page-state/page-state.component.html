<div class="page-state d-flex flex-col items-center justify-center text-muted gap-12 py-48 px-20">
  @if (loading()) {
    <span class="page-state-spinner" aria-hidden="true"></span>
    <span class="page-state-text">读取中…</span>
  } @else if (error()) {
    <span class="page-state-icon text-red" aria-hidden="true">⚠</span>
    <span class="page-state-text page-state-error text-red">{{ error() }}</span>
    @if (retryable()) {
      <button type="button" class="btn text-white bg-blue page-state-retry" (click)="retry.emit()">重试</button>
    }
  } @else {
    <span class="page-state-icon text-blue" aria-hidden="true">○</span>
    <span class="page-state-text">{{ emptyText() }}</span>
  }
</div>
