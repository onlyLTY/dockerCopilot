@if (confirm.dialog(); as dialog) {
  <div class="modal-backdrop confirm-backdrop" (click)="closeBackdrop($event)">
    <section class="modal modal-confirm modal-m" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="modal-head">
        <div><h2 class="m-0">{{ dialog.options.title }}</h2></div>
        <button class="modal-close" (click)="confirm.close(false)" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message my-22">{{ dialog.options.message }}</p>
      </div>
      <div class="modal-actions d-flex justify-end pt-18">
        <button class="btn btn-secondary" (click)="confirm.close(false)">{{ dialog.options.cancelText || '取消' }}</button>
        <button class="btn btn-primary py-12 px-16" [class.btn-danger]="dialog.options.danger" (click)="confirm.close(true)">{{ dialog.options.confirmText || '确定' }}</button>
      </div>
    </section>
  </div>
}
