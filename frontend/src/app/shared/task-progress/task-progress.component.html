@if (task(); as t) {
  <div class="modal-backdrop d-grid place-items-center" (click)="close($event)">
    <section class="modal min-w-0 d-grid modal-content modal-m" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <dc-modal-heading [title]="t.title" [subtitle]="t.message" (closed)="tasks.closeView()" />
      <div class="modal-body task-content d-flex flex-col">
        <div class="task-progress mt-20">
          <div class="progress-bar" [class.failed]="t.failed" [class.done]="t.isDone && !t.failed">
            <span class="d-block" [style.width.%]="t.percentage"></span>
          </div>
          <div class="progress-meta d-flex justify-between gap-12 mt-10 fs-12">
            <span [class.failed]="t.failed">
              {{ t.failed ? '失败' : t.isDone ? '已完成' : '进行中' }} · {{ t.percentage }}%
            </span>
            @if (!t.isDone) { <span class="text-muted">后台执行中，可关闭此窗口</span> }
          </div>
          @if (t.detailMsg) {
            <pre class="task-detail mt-16 pt-12 pb-12 px-14">{{ t.detailMsg }}</pre>
          }
        </div>
        <div class="task-actions d-flex items-center justify-end gap-8 pt-16">
          <button class="btn text-red bg-secondary-bg gap-4" (click)="remove(t.taskID)"><dc-icon class="icon-14" name="delete"></dc-icon>删除任务</button>
          <button class="btn text-white bg-blue" (click)="tasks.closeView()">关闭</button>
        </div>
      </div>
    </section>
  </div>
}
