<div class="login-page d-grid place-items-center">
  <div class="login-card p-38">
    <div class="brand centered justify-center p-0">
      <img class="brand-logo" src="assets/DockerCopilotlogo.png" alt="Docker Copilot">
      <div><strong>Docker Copilot</strong><span>容器管理平台</span></div>
    </div>
    <h1 class="mt-35 mb-7 mx-0 fs-24">登录管理台</h1>
    <p class="m-0 fs-14">输入服务端配置的 secretKey 继续</p>
    <label class="d-block mt-24 fs-12">Secret Key<input class="d-block mt-8 p-12" type="password" [(ngModel)]="secretKey" (keyup.enter)="login()" autocomplete="current-password"></label>
    <button class="btn btn-primary w-full" (click)="login()">进入管理台</button>
    @if (error()) {
      <div class="message error mt-12 fs-12">{{ error() }}</div>
    }
  </div>
</div>
