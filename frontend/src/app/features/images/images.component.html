<dc-page-heading title="镜像管理" subtitle="查看和管理 Docker 镜像">
  <div page-heading-actions>
    <button class="btn btn-secondary" [disabled]="!untaggedCount() || cleaning()" (click)="cleanup('untagged')"><dc-icon name="clean"></dc-icon>清理无 Tag ({{ untaggedCount() }})</button>
    <button class="btn btn-secondary" [disabled]="!unusedCount() || cleaning()" (click)="cleanup('unused')"><dc-icon name="clean"></dc-icon>清理未使用 ({{ unusedCount() }})</button>
    <button class="btn btn-primary" (click)="refresh()" title="刷新镜像"><dc-icon name="refresh"></dc-icon>刷新</button>
  </div>
</dc-page-heading>

<dc-stats [items]="stats()" [columns]="4"></dc-stats>

@if (images().length) {
  <section class="resource-grid page-scroll-area d-grid image-grid gap-16 mb-24">
    @for (image of images(); track image.id) {
      <dc-resource-card>
        <div resource-card-icon>
          <img class="resource-icon" [src]="icon(image)" [alt]="image.name" (error)="fallback($event)">
        </div>
        <div resource-card-title>
          <b class="d-flex items-center gap-8 min-w-0 fs-16">
            <span class="text-ellipsis min-w-0">{{ image.name || 'None' }}</span>
            <small class="status-badge d-inline-block py-2 px-8 fs-10" [class.used]="image.inUsed">{{ image.inUsed ? '使用中' : '未使用' }}</small>
          </b>
        </div>
        <div resource-card-info class="d-flex flex-col gap-4 fs-12 text-muted">
          <span class="d-flex items-center justify-between text-nowrap overflow-hidden gap-10 min-w-0">
            <span class="text-ellipsis min-w-0">{{ image.tag || 'None' }}</span>
            <span class="flex-none">{{ image.size }}</span>
          </span>
          @if (image.createTime) {
            <span class="d-block">发布于 {{ image.createTime }}</span>
          }
        </div>
        <div resource-card-actions class="d-flex gap-6">
          <button class="btn text-red-dark border-1 py-8 px-7 fs-12" (click)="remove(image, false)"><dc-icon name="delete"></dc-icon>删除</button>
          @if (!image.inUsed) {
            <button class="btn text-red border-1 py-8 px-7 fs-12" (click)="remove(image, true)"><dc-icon name="delete"></dc-icon>强制删除</button>
          }
        </div>
      </dc-resource-card>
    }
  </section>
} @else {
  <dc-page-state [loading]="loading()" [error]="error()" emptyText="暂无镜像"></dc-page-state>
}
