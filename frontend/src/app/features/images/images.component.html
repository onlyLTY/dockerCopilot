<section class="page-heading">
  <div>
    <p class="eyebrow">DOCKER OPERATIONS</p>
    <h1>镜像管理</h1>
    <p class="subtitle">查看和管理 Docker 镜像</p>
  </div>
  <div class="heading-actions">
    <button class="secondary" [disabled]="!untaggedCount || cleaning" (click)="cleanup('untagged')"><dc-icon name="delete"></dc-icon>清理无 Tag ({{ untaggedCount }})</button>
    <button class="secondary" [disabled]="!unusedCount || cleaning" (click)="cleanup('unused')"><dc-icon name="force-delete"></dc-icon>清理未使用 ({{ unusedCount }})</button>
    <button class="primary" (click)="load()" title="刷新镜像"><dc-icon name="refresh"></dc-icon>刷新</button>
  </div>
</section>

<div class="alert error-alert" *ngIf="error && images.length">ⓘ {{ error }}</div>

<section class="stats stats-four">
  <div><strong>{{ images.length }}</strong><span>总镜像</span></div>
  <div class="green"><strong>{{ usedCount }}</strong><span>使用中</span></div>
  <div class="amber"><strong>{{ unusedCount }}</strong><span>未使用</span></div>
  <div class="red"><strong>{{ untaggedCount }}</strong><span>无 Tag</span></div>
</section>

<dc-section-toolbar title="镜像列表" [subtitle]="images.length + ' 个镜像'"></dc-section-toolbar>

<section class="resource-grid image-grid" *ngIf="images.length">
  <article class="resource-card" *ngFor="let image of images">
    <div class="resource-head">
      <img class="resource-icon" [src]="icon(image)" [alt]="image.name" (error)="fallback($event)">
      <div>
        <b>{{ image.name || 'None' }}</b>
        <span>{{ image.tag || 'None' }}</span>
        <small>{{ image.inUsed ? '使用中' : '未使用' }}</small>
      </div>
    </div>
    <div class="resource-meta">
      <span>{{ image.size }}</span>
      <span>{{ image.createTime }}</span>
    </div>
    <div class="resource-actions">
      <button class="danger-link" (click)="remove(image, false)"><dc-icon name="delete"></dc-icon>删除</button>
      <button class="danger-link force" *ngIf="!image.inUsed" (click)="remove(image, true)"><dc-icon name="force-delete"></dc-icon>强制删除</button>
    </div>
  </article>
</section>

<dc-page-state *ngIf="!images.length" [loading]="loading" [error]="error" emptyText="暂无镜像"></dc-page-state>
