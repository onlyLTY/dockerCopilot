<div
  class="modal-backdrop d-grid place-items-center"
  (click)="$event.target === $event.currentTarget && close()"
>
  <section
    class="modal min-w-0 d-grid modal-form modal-settings"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <dc-modal-heading
      title="应用设置"
      subtitle="调整后台任务、备份和日志输出。"
      (closed)="close()"
    />
    <div class="modal-body">
      @if (settingsLoading()) {
        <div class="d-flex items-center justify-center py-30 text-muted">正在加载设置…</div>
      } @else if (settingsLoadFailed()) {
        <div class="d-flex flex-column items-center justify-center gap-10 py-30">
          <p class="text-red m-0">设置加载失败，未保存任何修改。</p>
          <button type="button" class="btn text-white bg-blue" (click)="reloadSettings()">重试</button>
        </div>
      } @else {
      <div class="settings-grid d-grid grid-cols-3 gap-20">
        <label class="form-field d-block mt-20 fs-12" title="更新检查配置仅影响后台自动检查；手动检查不受影响"
          >更新检查频率<dc-form-select
            class="d-block mt-8"
            [options]="updateSelectOptions()"
            [(ngModel)]="updateDraft"
          ></dc-form-select
        ></label>
        <label class="form-field d-block mt-20 fs-12" title="自动备份配置影响后台定时备份；不会立即创建备份"
          >自动备份频率<dc-form-select
            class="d-block mt-8"
            [options]="backupSelectOptions()"
            [(ngModel)]="backupDraft"
          ></dc-form-select
        ></label>
        <label class="form-field d-block mt-20 fs-12" title="JSON 和 YAML 分别保留最近的备份"
          >备份保留数量<input
            class="field-control d-block mt-8 py-12 px-12"
            type="number"
            min="1"
            max="100"
            [(ngModel)]="retentionDraft"
            title="JSON 和 YAML 分别保留最近的备份"
        /></label>
        <label class="form-field d-block mt-20 fs-12" title="日志级别立即影响新写入的日志；已有日志不会改变"
          >日志级别<dc-form-select
            class="d-block mt-8"
            [options]="logSelectOptions()"
            [(ngModel)]="logDraft"
          ></dc-form-select
        ></label>
        <label class="form-field d-block mt-20 fs-12" title="拉取镜像超时对保存后启动的拉取、更新、恢复和 Compose 部署生效；正在执行的任务不受影响"
          >拉取镜像超时（秒）<input
            class="field-control d-block mt-8 py-12 px-12"
            type="number"
            min="0"
            max="3600"
            [(ngModel)]="pullTimeoutDraft"
            title="0 表示未配置（使用默认 5 分钟）"
        /></label>
        <label
          class="form-field d-block mt-20 fs-12"
          title="用于版本检查和程序更新地址拼接，可留空。"
          >GitHub 地址前缀代理<input
            class="field-control d-block mt-8 py-12 px-12"
            type="url"
            [(ngModel)]="proxyDraft.githubProxy"
            placeholder="例如 https://github-proxy.example/"
            autocomplete="off"
            title="仅用于 Copilot 自身的版本检查和程序更新"
        /></label>
      </div>
      <dc-form-expansion
        class="mt-20"
        title="Docker加速源"
        description="用于官方镜像的更新检查，以及本应用内的更新/恢复/Compose 拉取；保存后对新发起的任务生效"
      >
        <div expansionActions class="d-flex flex-wrap gap-10">
          <button type="button" class="btn text-white bg-blue" (click)="addHubUrl()">添加</button>
          <button type="button" class="btn text-white bg-blue" (click)="resetHubUrls()">
            恢复默认
          </button>
        </div>
        <div class="d-grid gap-10 mt-12">
          @for (item of hubUrlsDraft; track trackHubUrl($index); let i = $index) {
            <div class="hub-url-row d-flex items-center gap-10">
              <span class="hub-url-index text-muted fs-12 text-right flex-none">{{ i + 1 }}</span>
              <input
                class="field-control flex-1 min-w-0 py-12 px-12"
                type="text"
                [ngModel]="item"
                (ngModelChange)="updateHubUrl(i, $event)"
                placeholder="例如 docker.m.daocloud.io"
                autocomplete="off"
              />
              <button
                type="button"
                class="btn text-secondary-text bg-secondary-bg"
                (click)="removeHubUrl(i)"
                title="删除"
              >
                删除
              </button>
            </div>
          }
          @if (!hubUrlsDraft.length) {
            <p class="text-muted fs-12 m-0">当前未配置加速源，检查更新与拉取时仅尝试官方源。</p>
          }
        </div>
      </dc-form-expansion>
      }
    </div>
    <div class="modal-actions d-flex justify-end gap-10 pt-18">
      <button class="btn text-secondary-text bg-secondary-bg" (click)="close()">取消</button>
      <button class="btn text-white bg-blue" [disabled]="saving()" (click)="saveSettings()">
        {{ saving() ? '保存中…' : '保存设置' }}
      </button>
    </div>
  </section>
</div>
