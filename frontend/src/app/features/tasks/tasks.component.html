<dc-page-heading title="任务" subtitle="查看容器更新、备份恢复、项目部署等异步任务的进度">
  <div page-heading-actions>
    <button class="btn text-secondary-text bg-secondary-bg" [disabled]="!doneCount() && !failedCount()" (click)="clearDone()"><dc-icon name="clean"></dc-icon>清除已完成</button>
    <button class="btn text-secondary-text bg-secondary-bg" [disabled]="!list().length" (click)="clearAll()"><dc-icon name="delete"></dc-icon>清空全部</button>
  </div>
</dc-page-heading>

<dc-stats [items]="stats()" [columns]="4" [activeKey]="filter()" (selectedChange)="selectFilter($event)"></dc-stats>

@if (filteredTasks().length) {
  <section class="task-list page-scroll-area responsive-card-grid d-grid gap-12 mb-24">
    @for (t of filteredTasks(); track t.taskID) {
      <dc-resource-card>
        <div resource-card-icon class="task-icon d-grid place-items-center">
          <dc-icon name="tasks"></dc-icon>
        </div>
        <div resource-card-title>
          <span class="text-ellipsis min-w-0">{{ t.title }}</span>
          <small class="task-state py-2 px-9 fs-12" [class.active]="!t.isDone" [class.ok]="t.isDone && !t.failed" [class.bad]="t.failed">{{ statusText(t) }}</small>
        </div>
        <div resource-card-info class="fs-12 text-muted">
          <span class="text-ellipsis">{{ t.message }}</span>
          <small>{{ t.percentage }}% · {{ time(t.updatedAt) }}</small>
        </div>
        <div resource-card-content>
          <div class="task-bar"><i class="d-block" [style.width.%]="t.percentage" [class.bad]="t.failed"></i></div>
        </div>
        <div resource-card-actions>
          <button class="btn text-blue bg-secondary-bg" (click)="view(t.taskID)"><dc-icon name="about"></dc-icon>详情</button>
          <button class="btn text-red bg-secondary-bg" (click)="remove(t.taskID)"><dc-icon name="delete"></dc-icon>删除</button>
        </div>
      </dc-resource-card>
    }
  </section>
} @else {
  <dc-page-state emptyText="暂无任务"></dc-page-state>
}
