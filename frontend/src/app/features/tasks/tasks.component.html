<dc-page-heading title="任务" subtitle="查看容器更新、备份恢复、项目部署等异步任务的进度">
  <div page-heading-actions>
    <button
      class="btn text-secondary-text bg-secondary-bg"
      [disabled]="!doneCount() && !failedCount()"
      (click)="clearDone()"
    >
      <dc-icon name="clean"></dc-icon>清除已完成
    </button>
    <button
      class="btn text-secondary-text bg-secondary-bg"
      title="请求停止全部进行中任务；不会删除任务记录，也不会回滚已执行的 Docker 操作"
      [disabled]="!activeCount()"
      (click)="stopAll()"
    >
      <dc-icon name="stop"></dc-icon>停止全部
    </button>
  </div>
</dc-page-heading>

<dc-stats
  [items]="stats()"
  [columns]="4"
  [activeKey]="filter()"
  (selectedChange)="selectFilter($event)"
></dc-stats>

@if (filteredTasks().length) {
  <section class="page-scroll-area responsive-card-grid d-grid gap-12 mb-24">
    @for (t of filteredTasks(); track t.taskID) {
      <dc-resource-card>
        <div resource-card-title>
          <span
            class="d-inline-block flex-none rounded py-3 px-8 fs-12 fw-500 text-white lh-12"
            [class.bg-green]="t.isDone && !t.failed && !t.canceled && !t.timedOut"
            [class.bg-amber]="!t.isDone || t.canceled || t.timedOut"
            [class.bg-red]="t.failed && !t.canceled && !t.timedOut"
          >
            {{ statusText(t) }}
          </span>
          <span
            class="text-ellipsis min-w-0 flex-1"
            [matTooltip]="t.title"
            >{{ t.title }}</span
          >
        </div>
        <div resource-card-info class="fs-12 text-muted mt-4">
          <span>{{ time(t.updatedAt) }}</span>
        </div>
        <div resource-card-content class="mt-14">
          <div class="d-flex justify-between items-center fs-12 mb-6">
            <span
              class="text-ellipsis min-w-0 text-muted"
              [matTooltip]="t.message"
              >{{ t.message }}</span
            >
            <b
              class="ml-8"
              [class.text-red]="t.failed && !t.canceled && !t.timedOut"
              [class.text-green]="t.isDone && !t.failed && !t.canceled && !t.timedOut"
              [class.text-blue]="!t.isDone"
              >{{ t.percentage }}%</b
            >
          </div>
          <div class="h-6 rounded-3 bg-line overflow-hidden">
            <i
              class="d-block h-full bg-blue transition-width"
              [style.width.%]="t.percentage"
              [class.bg-green]="t.isDone && !t.failed"
              [class.bg-red]="t.failed"
            ></i>
          </div>
        </div>
        <div resource-card-actions>
          <button class="btn text-blue bg-secondary-bg" (click)="view(t.taskID)">
            <dc-icon name="about"></dc-icon>详情
          </button>
          @if (!t.isDone) {
            <button
              class="btn text-red bg-secondary-bg"
              [disabled]="tasks.canceling().has(t.taskID)"
              (click)="cancel(t.taskID)"
            >
              <dc-icon name="stop"></dc-icon>{{ tasks.canceling().has(t.taskID) ? '停止中…' : '停止任务' }}
            </button>
          }
          @if (t.isDone) {
            <button class="btn text-red bg-secondary-bg" (click)="remove(t.taskID)">
              <dc-icon name="delete"></dc-icon>删除
            </button>
          }
        </div>
      </dc-resource-card>
    }
  </section>
} @else {
  <dc-page-state emptyText="暂无任务"></dc-page-state>
}
