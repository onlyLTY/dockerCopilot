<section class="page-heading">
  <div>
    <p class="eyebrow">DOCKER OPERATIONS</p>
    <h1>容器管理</h1>
    <p class="subtitle">管理您的 Docker 容器，包括启动、停止、重启等操作</p>
  </div>
  <div class="heading-actions">
    <button class="secondary" disabled title="批量操作">批量操作</button>
    <button class="primary" (click)="load()" title="刷新容器"><dc-icon name="refresh"></dc-icon>刷新</button>
  </div>
</section>

<div class="alert error-alert" *ngIf="error && containers.length">ⓘ {{ error }}</div>

<section class="stats stats-four">
  <div><strong>{{ containers.length }}</strong><span>总容器</span></div>
  <div class="green"><strong>{{ runningCount }}</strong><span>运行中</span></div>
  <div class="red"><strong>{{ containers.length - runningCount }}</strong><span>已停止</span></div>
  <div class="amber"><strong>{{ updateCount }}</strong><span>有更新</span></div>
</section>

<dc-section-toolbar title="容器列表" [subtitle]="containers.length + ' 个容器'"></dc-section-toolbar>

<section class="resource-grid dense-grid" *ngIf="containers.length">
  <article class="resource-card" *ngFor="let item of containers">
    <div class="resource-head">
      <img class="resource-icon" [src]="icon(item)" [alt]="item.name" (error)="fallback($event)">
      <div>
        <b>{{ item.name }}</b>
        <span>{{ item.usingImage }}</span>
        <small [class.running]="isRunning(item)">{{ item.status }}</small>
      </div>
    </div>
    <div class="resource-meta">
      <span>{{ item.runningTime || item.createTime }}</span>
      <i [class.running-dot]="isRunning(item)"></i>
    </div>
    <div class="resource-actions">
      <button class="stop-action" *ngIf="isRunning(item)" (click)="stop(item)"><dc-icon name="stop"></dc-icon>停止</button>
      <button class="start-action" *ngIf="!isRunning(item)" (click)="start(item)"><dc-icon name="start"></dc-icon>启动</button>
      <button (click)="restart(item)"><dc-icon name="restart"></dc-icon>重启</button>
      <button class="update-action" (click)="update(item)"><dc-icon name="update"></dc-icon>更新</button>
    </div>
  </article>
</section>

<dc-page-state *ngIf="!containers.length" [loading]="loading" [error]="error" emptyText="暂无容器"></dc-page-state>
