<div
  class="d-flex h-screen overflow-hidden bg-page-bg"
  [class.public-shell]="!auth.isAuthenticated()"
  [class.compact-shell]="ui.compact()"
  [class.dark-shell]="ui.theme() === 'dark'"
>
  @if (auth.isAuthenticated()) {
    <aside class="sidebar d-flex flex-col" [class.open]="open">
      <div class="brand d-flex flex-none border-b-1 px-8 pb-12 items-center gap-12">
        <img
          class="flex-none w-48 h-48 rounded-14 object-contain"
          src="assets/DockerCopilotlogo.png"
          alt="Docker Copilot"
        />
        <div>
          <span class="d-block fs-17 fw-650 text-black text-nowrap">Docker Copilot</span>
          <span class="d-block mt-4 fs-12 text-muted text-nowrap">容器管理平台</span>
        </div>
      </div>
      <nav class="d-grid gap-6">
        <a
          class="d-flex items-center gap-12"
          href="#/containers"
          title="容器"
          [class.active]="isActive('/containers')"
          (click)="navigate('/containers')"
          ><dc-icon class="icon-22" name="containers"></dc-icon><span>容器</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/images"
          title="镜像"
          [class.active]="isActive('/images')"
          (click)="navigate('/images')"
          ><dc-icon class="icon-22" name="images"></dc-icon><span>镜像</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/compose"
          title="项目"
          [class.active]="isActive('/compose')"
          (click)="navigate('/compose')"
          ><dc-icon class="icon-22" name="compose"></dc-icon><span>项目</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/backups"
          title="备份"
          [class.active]="isActive('/backups')"
          (click)="navigate('/backups')"
          ><dc-icon class="icon-22" name="storage"></dc-icon><span>备份</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/icons"
          title="图标"
          [class.active]="isActive('/icons')"
          (click)="navigate('/icons')"
          ><dc-icon class="icon-22" name="icons"></dc-icon><span>图标</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/ports"
          title="端口"
          [class.active]="isActive('/ports')"
          (click)="navigate('/ports')"
          ><dc-icon class="icon-22" name="ports"></dc-icon><span>端口</span></a
        >
        <a
          class="d-flex items-center gap-12"
          href="#/tasks"
          title="任务"
          [class.active]="isActive('/tasks')"
          (click)="navigate('/tasks')"
          ><dc-icon class="icon-22" name="tasks"></dc-icon><span>任务</span>
          @if (tasks.activeCount()) {
            <em
              class="nav-badge ml-auto py-0 px-5 d-inline-grid place-items-center fs-12 bg-blue text-white lh-1 min-w-18 h-18 rounded-9"
              >{{ tasks.activeCount() }}</em
            >
          }
        </a>
        <a
          class="d-flex items-center gap-12"
          href="#/about"
          title="关于"
          [class.active]="isActive('/about')"
          (click)="navigate('/about')"
          ><dc-icon class="icon-22" name="about"></dc-icon><span>关于</span></a
        >
      </nav>
      <div class="flex-none mt-auto pt-8">
        <div class="sidebar-actions d-flex items-center gap-6 p-4 mb-12">
          <button
            class="theme-button d-grid place-items-center"
            [class.selected]="ui.theme() === 'dark'"
            (click)="ui.toggleTheme()"
            [attr.title]="ui.theme() === 'dark' ? '切换浅色主题' : '切换深色主题'"
            [attr.aria-label]="ui.theme() === 'dark' ? '切换浅色主题' : '切换深色主题'"
          >
            <dc-icon class="icon-22" name="theme"></dc-icon>
          </button>
          <button
            class="display-button d-grid place-items-center"
            [class.selected]="ui.compact()"
            (click)="ui.toggleCompact()"
            title="切换显示"
            aria-label="切换显示"
          >
            <dc-icon class="icon-22" name="display"></dc-icon>
          </button>
          <button
            class="sidebar-logout d-grid place-items-center ml-auto text-red"
            (click)="logout()"
            title="退出"
            aria-label="退出"
          >
            <dc-icon class="icon-22" name="logout"></dc-icon>
          </button>
        </div>
        <div class="sidebar-version-card p-0 border-1 rounded-12 bg-white overflow-hidden">
          <div class="p-14 d-flex items-center justify-between">
            <span class="text-muted fs-12">版本信息</span>
            <span class="fs-14 fw-650">{{ version().version || '读取中' }}</span>
          </div>
        </div>
      </div>
    </aside>
  }
  @if (open && auth.isAuthenticated()) {
    <button class="sidebar-overlay" (click)="closeMenu()" aria-label="关闭菜单"></button>
  }
  <div class="content-wrap flex-1 min-w-0">
    @if (auth.isAuthenticated()) {
      <header class="topbar items-center gap-16">
        <button class="btn btn-icon" (click)="open = !open" aria-label="打开菜单" title="打开菜单">
          <dc-icon class="icon-36" name="menu"></dc-icon>
        </button>
        <button
          class="mobile-logout d-inline-flex items-center justify-center"
          (click)="logout()"
          title="退出"
          aria-label="退出"
        >
          <dc-icon class="icon-36" name="logout"></dc-icon>
        </button>
      </header>
    }
    <main><ng-content /></main>
  </div>
</div>
