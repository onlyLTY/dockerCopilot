name: latest

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - version
      - frontend/**

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-frontend-dist
          path: build/frontend/browser

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v3

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-frontend-*
          merge-multiple: true
          path: frontend-dist

      - run: ls -R frontend-dist
      - run: test -f frontend-dist/index.html

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.4'
          cache: false

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -C backend -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o ../build/backend/linux/${{ matrix.arch }}/dockerCopilot-new .

      - name: Package release (binary + frontend)
        run: |
          # 组装更新包：dockerCopilot-new(后端) + web/(前端)。
          # updateprogram.go 会在解压后分别取二进制与 web 目录，实现前后端同步更新。
          rm -rf release-pkg
          mkdir -p release-pkg/web
          cp build/backend/linux/${{ matrix.arch }}/dockerCopilot-new release-pkg/dockerCopilot-new
          cp -r frontend-dist/. release-pkg/web/
          tar -czvf dockerCopilot-${{ matrix.arch }}.tar.gz -C release-pkg .

      - name: List current directory
        run: ls -la

      - name: Check if release already exists
        id: check_release
        run: |
          exists=$(gh release view ${{ env.version }} 2>&1 | grep "release not found" || true)
          if [[ -z "$exists" ]]; then
            echo "Release exists"
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Release does not exist"
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release if not exists
        if: env.RELEASE_EXISTS == 'false'
        run: |
          gh release create ${{ env.version }} \
            --title "${{ env.version }}" \
            --notes "Release of version ${{ env.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Asset for ${{ matrix.arch }}
        run: |
          gh release upload ${{ env.version }} dockerCopilot-${{ matrix.arch }}.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
