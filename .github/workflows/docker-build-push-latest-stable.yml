name: docker-build-push-latest-stable

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - version
      - frontend/**
      - backend/**
      - docker/**

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-frontend-dist
          path: build/frontend/browser

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v3

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-frontend-*
          merge-multiple: true
          path: frontend-dist

      - run: ls -R frontend-dist
      - run: test -f frontend-dist/index.html

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.4'
          cache: false

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -C backend -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o ../build/backend/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare Files
        run: |
          mkdir -p build/docker/dist/linux/${{ matrix.arch }} build/docker/etc build/docker/web
          cp build/backend/linux/${{ matrix.arch }}/dockerCopilot build/docker/dist/linux/${{ matrix.arch }}/dockerCopilot
          cp -r backend/etc/. build/docker/etc/
          cp -r frontend-dist/. build/docker/web/

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-backend-${{ matrix.arch }}
          path: build/docker

  docker-setup:
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    steps:
      - name: Checkout code Now Code
        uses: actions/checkout@v3

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-backend-*
          merge-multiple: true
          path: build/docker

      - run: ls -R build/docker

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dockercopilot:latest
          push: true