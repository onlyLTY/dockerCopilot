name: ghcr-latest

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - version

concurrency:
  group: ghcr-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_REPOSITORY: autunn/Docker-Copilot-React
  FRONTEND_REF: 796fd94d38a272e135b471d487d83413ed69e553
  IMAGE_NAME: ghcr.io/autunn/dockercopilot

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghcr-frontend-dist
          path: front

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum

      - name: Validate version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < version)"
          if [[ ! "$version" =~ ^[vV]?[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Run backend tests
        if: matrix.arch == 'amd64'
        run: go test ./...

      - name: Build backend
        shell: bash
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -a --trimpath \
            -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=$VERSION -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$build_date" \
            -o dist/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare backend artifact
        shell: bash
        run: |
          mkdir -p package
          cp -R dist package/dist
          cp -R etc package/etc

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-backend-${{ matrix.arch }}
          path: package
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download backend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ghcr-backend-*
          path: dc-back
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-latest
          cache-to: type=gha,mode=max,scope=ghcr-latest
          provenance: mode=max
          sbom: true
