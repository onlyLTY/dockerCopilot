name: ghcr-latest

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Immutable Docker-Copilot-React commit SHA
        required: false
        type: string
  push:
    branches:
      - latest
    paths:
      - version

concurrency:
  group: ghcr-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_REPOSITORY: autunn/Docker-Copilot-React
  FRONTEND_REF: ${{ inputs.frontend_ref || 'afc2105211eb1adaa417ce8c125f2a91789c9bf1' }}
  IMAGE_NAME: ghcr.io/autunn/dockercopilot

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr-frontend-dist
          path: front

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum

      - name: Validate version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < version)"
          if [[ ! "$version" =~ ^[vV]?[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Run backend tests
        if: matrix.arch == 'amd64'
        run: go test ./...

      - name: Build backend
        shell: bash
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -a --trimpath \
            -ldflags="-w -s -X github.com/onlyLTY/dockerCopilot/internal/config.Version=$VERSION -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$build_date" \
            -o dist/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare backend artifact
        shell: bash
        run: |
          mkdir -p package
          cp -R dist package/dist
          cp -R etc package/etc

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-backend-${{ matrix.arch }}
          path: package
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghcr-backend-*
          path: dc-back
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-latest
          cache-to: type=gha,mode=max,scope=ghcr-latest
          provenance: mode=max
          sbom: true
