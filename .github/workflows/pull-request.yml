name: pull-request

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/**
      - docker/**
      - backend/dockercopilot.api

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: backend/go.sum

      - name: Test backend
        run: |
          cd backend
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Validate API spec when goctl is available
        run: |
          if command -v goctl >/dev/null 2>&1; then
            cd backend
            goctl api validate -api dockercopilot.api
          else
            echo 'goctl is not installed; API validation is skipped'
          fi
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        env:
          secretKey: ci-compose-validation-key
        run: docker compose -f docker/docker-compose.yml config
