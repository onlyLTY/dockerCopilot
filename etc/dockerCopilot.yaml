Name: dockerCopilot
Host: 0.0.0.0
Port: 12712
Timeout: 100000000000000
Log:
  Encoding: plain
Auth:
  AccessSecret: ${secretKey}
  AccessExpire: 7257600
CorsOrigins: []
Compose:
  ScanPaths:
    - /compose
  BackupDir: /data/backups/compose-projects
  MaxDepth: 3
  MaxFileSize: 10485760
  MaxFiles: 20
  AllowHighRisk: false
  CommandTimeoutSec: 300
